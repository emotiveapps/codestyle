# Template: copy this file into a Vapor package's folder (the one holding its Package.swift) as
# `.swiftlint.yml`, and run `swiftlint` from that folder.
#
# Its parent is the Vapor config, whose parent is the canonical config, so the package gets both. It must
# be linted from its own folder: SwiftLint ignores `parent_config` in a nested `.swiftlint.yml` when it is
# run from a repo root. In a repo that also holds apps, the root `.swiftlint.yml` excludes this folder,
# and the repo's lint command runs SwiftLint twice, once at the root and once here.
parent_config: https://raw.githubusercontent.com/emotiveapps/codestyle/main/swift/.swiftlint-vapor.yml

# Exclusions live here, not in a parent: a parent's paths resolve against the parent's location and never
# reach this package. Globs, not bare names: a bare `.build` covers only this folder's, not a nested one's,
# and `swiftlint --fix` would then rewrite third-party checkouts.
excluded:
  - "**/.build"
  - "**/.build-linux"
  - "**/.swiftpm"
